name: Validate landscape observability

on:
  push:
    branches:
      - feature/landscape-observability-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: landscape-observability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wire-diagnostic-export:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/landscape-observability-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: feature/landscape-observability-v1
          persist-credentials: true

      - name: Apply exact wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'completedDiagnosticPath' app/src/main/java/com/libreseed/pocketbuild/PocketBuildViewModel.kt; then
            echo 'Diagnostic export is already wired.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/wire_diagnostic_export.py')
          text = path.read_text()
          old = '''ui_path = Path("app/src/main/java/com/libreseed/pocketbuild/ui/PocketBuildApp.kt")
          ui_text = ui_path.read_text()
          old_callbacks = ''' + "'''" + '''                            onCancelOperation = onCancelOperation,
                                      onClearOperation = onClearOperation,
          ''' + "'''" + '''
          new_callbacks = ''' + "'''" + '''                            onCancelOperation = onCancelOperation,
                                      onClearOperation = onClearOperation,
                                      onExportOperation = onExportOperation,
          ''' + "'''" + '''
          callback_count = ui_text.count(old_callbacks)
          if callback_count != 2:
              raise SystemExit(f"PocketBuildApp.kt: expected two AppContent callback blocks, found {callback_count}")
          ui_path.write_text(ui_text.replace(old_callbacks, new_callbacks))
          '''
          new = '''replace_once(
              "app/src/main/java/com/libreseed/pocketbuild/ui/PocketBuildApp.kt",
              ''' + "'''" + '''                            onCancelOperation = onCancelOperation,
                                      onClearOperation = onClearOperation,
          ''' + "'''" + ''',
              ''' + "'''" + '''                            onCancelOperation = onCancelOperation,
                                      onClearOperation = onClearOperation,
                                      onExportOperation = onExportOperation,
          ''' + "'''" + ''',
          )

          replace_once(
              "app/src/main/java/com/libreseed/pocketbuild/ui/PocketBuildApp.kt",
              ''' + "'''" + '''                        onCancelOperation = onCancelOperation,
                                  onClearOperation = onClearOperation,
          ''' + "'''" + ''',
              ''' + "'''" + '''                        onCancelOperation = onCancelOperation,
                                  onClearOperation = onClearOperation,
                                  onExportOperation = onExportOperation,
          ''' + "'''" + ''',
          )
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one combined callback block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m py_compile .github/scripts/wire_diagnostic_export.py
          python .github/scripts/wire_diagnostic_export.py
          git diff --check
          git config user.name "PocketHost Audit"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "Wire diagnostic report sharing"
          git push origin HEAD:feature/landscape-observability-v1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Prepare generated validation assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/toolchain
          cp -L "$JAVA_HOME/lib/security/cacerts" app/src/main/assets/toolchain/cacerts
          test -s app/src/main/assets/toolchain/cacerts

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          gradle --stacktrace :app:compileDebugKotlin

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --stacktrace :app:testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle --stacktrace :app:lintDebug
          STATUS=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            echo "===== COMPLETE ANDROID LINT REPORT ====="
            cat "$REPORT"
            echo "===== END ANDROID LINT REPORT ====="
          fi
          exit "$STATUS"

      - name: Verify observability wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'OperationJournal' app/src/main/java/com/libreseed/pocketbuild/PocketBuildViewModel.kt
          grep -F 'LandscapePreference' app/src/main/java/com/libreseed/pocketbuild/MainActivity.kt
          grep -F 'LinearProgressIndicator' app/src/main/java/com/libreseed/pocketbuild/ui/PocketBuildApp.kt
          grep -F 'cancelActiveOperation' app/src/main/java/com/libreseed/pocketbuild/PocketBuildViewModel.kt
          ! grep -R -F 'onClick = { }' app/src/main/java
