name: Validate landscape observability

on:
  push:
    branches:
      - feature/landscape-observability-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: landscape-observability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correct-cancellation-wording:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/landscape-observability-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: feature/landscape-observability-v1
          persist-credentials: true

      - name: Apply exact wording correction
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'Waiting for the Gradle launcher to stop' app/src/main/java/com/libreseed/pocketbuild/PocketBuildViewModel.kt; then
            echo 'Cancellation wording is already corrected.'
            exit 0
          fi
          python .github/scripts/correct_cancellation_wording.py
          git diff --check
          git config user.name "PocketHost Audit"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "Clarify Gradle cancellation limits"
          git push origin HEAD:feature/landscape-observability-v1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Prepare generated validation assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/toolchain
          cp -L "$JAVA_HOME/lib/security/cacerts" app/src/main/assets/toolchain/cacerts
          test -s app/src/main/assets/toolchain/cacerts

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euo pipefail
          gradle --stacktrace :app:compileDebugKotlin

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --stacktrace :app:testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle --stacktrace :app:lintDebug
          STATUS=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            echo "===== COMPLETE ANDROID LINT REPORT ====="
            cat "$REPORT"
            echo "===== END ANDROID LINT REPORT ====="
          fi
          exit "$STATUS"

      - name: Verify observability wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'OperationJournal' app/src/main/java/com/libreseed/pocketbuild/PocketBuildViewModel.kt
          grep -F 'LandscapePreference' app/src/main/java/com/libreseed/pocketbuild/MainActivity.kt
          grep -F 'LinearProgressIndicator' app/src/main/java/com/libreseed/pocketbuild/ui/PocketBuildApp.kt
          grep -F 'cancelActiveOperation' app/src/main/java/com/libreseed/pocketbuild/PocketBuildViewModel.kt
          grep -F 'exportActiveOperation' app/src/main/java/com/libreseed/pocketbuild/PocketBuildViewModel.kt
          grep -F 'Share diagnostic report' app/src/main/java/com/libreseed/pocketbuild/ui/PocketBuildApp.kt
          ! grep -R -F 'onClick = { }' app/src/main/java
