name: Build debug APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketbuild-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Cache Gradle data
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build and test
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew \
            --stacktrace \
            testDebugUnitTest \
            lintDebug \
            assembleDebug

      - name: Record APK checksum
        shell: bash
        run: |
          mkdir -p ci-output
          cp app/build/outputs/apk/debug/app-debug.apk ci-output/PocketBuild-debug.apk
          sha256sum ci-output/PocketBuild-debug.apk > ci-output/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "built_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > ci-output/BUILD_INFO.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketBuild-debug-apk
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
