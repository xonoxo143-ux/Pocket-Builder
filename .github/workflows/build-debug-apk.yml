name: Build debug APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pockethost-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/landscape-observability-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare stable development signing and runtime trust store
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci app/src/main/assets/toolchain
          base64 --decode ci/pockethost-dev.jks.b64 > ci/pockethost-dev.jks
          keytool -list -keystore ci/pockethost-dev.jks -storepass pockethost -alias pockethost
          cp -L "$JAVA_HOME/lib/security/cacerts" app/src/main/assets/toolchain/cacerts
          test -s app/src/main/assets/toolchain/cacerts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and Build Tools
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Download and verify official Godot 4.7 Android runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godotTemplate/libs
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/SHA512-SUMS.txt" \
            --output godotTemplate/libs/SHA512-SUMS.txt
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/godot-lib.4.7.stable.template_release.aar" \
            --output godotTemplate/libs/godot-lib.aar
          cd godotTemplate/libs
          grep "  godot-lib.4.7.stable.template_release.aar$" SHA512-SUMS.txt \
            | sed 's/godot-lib.4.7.stable.template_release.aar/godot-lib.aar/' \
            | sha512sum --check --strict -

      - name: Build embedded ARM64 Godot template
        shell: bash
        run: |
          gradle --stacktrace :godotTemplate:assembleDebug
          mkdir -p app/src/main/assets/templates
          cp \
            godotTemplate/build/outputs/apk/debug/godotTemplate-debug.apk \
            app/src/main/assets/templates/godot-4.7-arm64-template.apk
          test -s app/src/main/assets/templates/godot-4.7-arm64-template.apk

      - name: Verify toolchain controls are connected
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'TextButton(onClick = { })' app/src/main/java/com/libreseed/pocketbuild/ui/PocketBuildApp.kt
          grep -F 'onToolchainAction = viewModel::installOrVerifyToolchain' app/src/main/java/com/libreseed/pocketbuild/MainActivity.kt
          grep -F 'gradleBuilder.installToolchain' app/src/main/java/com/libreseed/pocketbuild/PocketBuildViewModel.kt

      - name: Build, test, and lint PocketHost
        shell: bash
        run: |
          set +e
          gradle \
            --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug
          STATUS=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            echo "===== COMPLETE ANDROID LINT REPORT ====="
            cat "$REPORT"
            echo "===== END ANDROID LINT REPORT ====="
          fi
          exit "$STATUS"

      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          test -x "$APKSIGNER"
          unzip -t "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.pocket' versionCode='7' versionName='0.6.1'"

      - name: Record APK checksum
        shell: bash
        run: |
          mkdir -p ci-output
          cp app/build/outputs/apk/debug/app-debug.apk ci-output/PocketHost-0.6.1-debug.apk
          sha256sum ci-output/PocketHost-0.6.1-debug.apk > ci-output/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "host_runtime=webview-html-js-wasm"
            echo "host_core_api=1"
            echo "local_android_builder=gradle-wrapper-openjdk17-arm64"
            echo "android_build_tools=34.0.4-arm64"
            echo "android_platforms=downloaded-on-demand"
            echo "godot_runtime=4.7-stable-arm64"
            echo "toolchain_install_ui=connected-with-live-status"
            echo "built_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > ci-output/BUILD_INFO.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketHost-0.6.1-apk
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
