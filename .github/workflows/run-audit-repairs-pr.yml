name: Run audited repairs on PR

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/landscape-observability-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/landscape-observability-v1
          persist-credentials: true

      - name: Apply exact audited repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one literal match, found {count}")
              file.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}")
              file.write_text(updated)

          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/model/ObservabilityModels.kt',
              '    GRADLE_BUILD,\n}',
              '    GRADLE_BUILD,\n    APK_INSTALL,\n}',
          )

          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/PocketBuildViewModel.kt',
              """    fun clearOperationReport() {
        if (_uiState.value.activeOperation?.status == OperationStatus.RUNNING) return
        _uiState.update { it.copy(activeOperation = null) }
    }
""",
              """    fun clearOperationReport() {
        if (_uiState.value.activeOperation?.status == OperationStatus.RUNNING) return
        _uiState.update { it.copy(activeOperation = null) }
    }

    fun reportInstallerFailure(path: String?, error: Throwable) {
        val fileName = path?.let(::File)?.name ?: "APK"
        val message = error.message ?: "Android's package installer could not be opened."
        val operationId = beginOperation(
            kind = OperationKind.APK_INSTALL,
            title = "Install $fileName",
            firstStage = "Launching Android installer",
            detail = "Handing the verified APK to Android's package installer.",
            cancellable = false,
            stages = listOf("Launching Android installer"),
        )
        if (operationId != null) {
            finishOperationFailure(
                operationId = operationId,
                error = error,
                fallback = "Android installer could not be opened.",
            )
        }
        _uiState.update { it.copy(notice = message) }
    }
""",
          )

          regex_once(
              'app/src/main/java/com/libreseed/pocketbuild/MainActivity.kt',
              r'    private fun requestInstallApk\(path: String\) \{.*?\n    \}\n\n    private fun launchPackageInstaller\(apk: File\) \{.*?\n    \}\n',
              """    private fun requestInstallApk(path: String) {
        val apk = File(path)
        if (!apk.isFile) {
            viewModel.reportInstallerFailure(path, IllegalStateException("The generated APK no longer exists."))
            return
        }
        pendingInstallPath = path
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
            runCatching {
                startActivity(
                    Intent(
                        Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                        Uri.parse("package:$packageName"),
                    ),
                )
            }.onFailure { error ->
                pendingInstallPath = null
                viewModel.reportInstallerFailure(path, error)
            }
        } else {
            launchPackageInstaller(apk)
        }
    }

    private fun launchPackageInstaller(apk: File) {
        val path = apk.absolutePath
        runCatching {
            val uri = FileProvider.getUriForFile(this, "$packageName.files", apk)
            val intent = Intent(Intent.ACTION_VIEW).apply {
                setDataAndType(uri, "application/vnd.android.package-archive")
                addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
            }
            startActivity(intent)
        }.onSuccess {
            pendingInstallPath = null
        }.onFailure { error ->
            pendingInstallPath = null
            viewModel.reportInstallerFailure(path, error)
        }
    }
""",
          )

          firewall = Path('app/src/main/java/com/libreseed/pocketbuild/host/CapabilityFirewall.kt')
          text = firewall.read_text()
          count = text.count('key(app.id, capability)')
          if count != 3:
              raise SystemExit(f'CapabilityFirewall.kt: expected three old grant keys, found {count}')
          text = text.replace('key(app.id, capability)', 'key(app, capability)')
          old_key = '    private fun key(appId: String, capability: String): String = "$appId::$capability"\n'
          new_key = '    private fun key(app: HostedApp, capability: String): String = "${app.id}::${app.root.name}::$capability"\n'
          if text.count(old_key) != 1:
              raise SystemExit('CapabilityFirewall.kt: key function did not match')
          firewall.write_text(text.replace(old_key, new_key, 1))

          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/host/HostActivity.kt',
              'import com.libreseed.pocketbuild.ui.theme.PocketBuildTheme\n',
              'import com.libreseed.pocketbuild.ui.applyPhoneLandscapePreference\nimport com.libreseed.pocketbuild.ui.theme.PocketBuildTheme\n',
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/host/HostActivity.kt',
              '    private lateinit var store: HostStore\n    private var apps by mutableStateOf<List<HostedApp>>(emptyList())\n',
              '    private lateinit var store: HostStore\n    private lateinit var firewall: CapabilityFirewall\n    private var apps by mutableStateOf<List<HostedApp>>(emptyList())\n',
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/host/HostActivity.kt',
              """    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        enableEdgeToEdge()
        store = HostStore(this)
""",
              """    override fun onCreate(savedInstanceState: Bundle?) {
        applyPhoneLandscapePreference()
        super.onCreate(savedInstanceState)
        enableEdgeToEdge()
        store = HostStore(this)
        firewall = CapabilityFirewall(this)
""",
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/host/HostActivity.kt',
              """                    result.onSuccess {
                        refreshApps()
                        status = "Deleted ${app.name}."
""",
              """                    result.onSuccess {
                        firewall.revokeApp(app.id)
                        refreshApps()
                        status = "Deleted ${app.name}."
""",
          )

          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/host/RuntimeActivity.kt',
              '            } ?: true\n',
              '            } ?: (name in LOGICAL_PERMISSION_NAMES)\n',
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/host/RuntimeActivity.kt',
              """        if (platformPermissions.isEmpty()) {
            callback(names.associateWith { true })
            return
        }
""",
              """        if (platformPermissions.isEmpty()) {
            callback(names.associateWith { it in LOGICAL_PERMISSION_NAMES })
            return
        }
""",
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/host/RuntimeActivity.kt',
              """        if (missing.isEmpty()) {
            callback(names.associateWith { true })
            return
        }
""",
              """        if (missing.isEmpty()) {
            callback(names.associateWith(::isPermissionGrantedOrImplicit))
            return
        }
""",
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/host/RuntimeActivity.kt',
              '    private fun permissionForName(name: String): String? = when (name) {\n',
              """    private fun isPermissionGrantedOrImplicit(name: String): Boolean {
        val permission = permissionForName(name)
        return when {
            permission != null -> ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED
            name in LOGICAL_PERMISSION_NAMES -> true
            else -> false
        }
    }

    private fun permissionForName(name: String): String? = when (name) {
""",
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/host/RuntimeActivity.kt',
              '    companion object {\n        const val EXTRA_APP_ID = "hosted_app_id"\n\n        private val BOOTSTRAP_SCRIPT = """\n',
              """    companion object {
        const val EXTRA_APP_ID = "hosted_app_id"

        private val LOGICAL_PERMISSION_NAMES = setOf(
            "camera", "microphone", "location", "location.fine", "location.coarse",
            "contacts.read", "contacts.write", "calendar.read", "calendar.write",
            "activity", "bodySensors", "notifications", "bluetooth.scan",
            "bluetooth.connect", "bluetooth.advertise", "nearbyWifi",
            "media.images", "media.video", "media.audio", "phone.call",
        )

        private val BOOTSTRAP_SCRIPT = """
""",
          )

          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/gradle/MobileGradleToolchain.kt',
              """        check(StatFs(files.absolutePath).availableBytes >= MIN_FREE_BYTES) {
            "At least 1.2 GB of free app storage is required for the local Android toolchain."
        }

        if (!baseReady()) installBase(onProgress)
        val env = environment(validate = true)
        val platforms = requiredPlatforms.filter { it in MIN_PLATFORM..MAX_PLATFORM }.ifEmpty { setOf(DEFAULT_PLATFORM) }
        platforms.sorted().forEachIndexed { index, api ->
            if (!File(env.sdk, "platforms/android-$api/android.jar").isFile) {
                val base = 0.84f + (index.toFloat() / max(1, platforms.size)) * 0.13f
                installPlatform(api, env.sdk, base, onProgress)
            }
        }
""",
              """        val platforms = requiredPlatforms.filter { it in MIN_PLATFORM..MAX_PLATFORM }.ifEmpty { setOf(DEFAULT_PLATFORM) }
        val baseInstalled = baseReady()
        val existingEnvironment = if (baseInstalled) environment(validate = true) else null
        val missingPlatforms = platforms.filter { api ->
            existingEnvironment == null || !File(existingEnvironment.sdk, "platforms/android-$api/android.jar").isFile
        }
        if (baseInstalled && missingPlatforms.isEmpty()) {
            onProgress(Progress("Toolchain ready", "JDK 17, Android SDK and ARM64 build tools are ready.", 1f))
            return existingEnvironment
        }
        val requiredFreeBytes = if (baseInstalled) MIN_PLATFORM_FREE_BYTES else MIN_FREE_BYTES
        check(StatFs(files.absolutePath).availableBytes >= requiredFreeBytes) {
            if (baseInstalled) "At least 512 MB of free app storage is required to add the missing Android SDK platform."
            else "At least 1.2 GB of free app storage is required for the local Android toolchain."
        }

        if (!baseInstalled) installBase(onProgress)
        val env = environment(validate = true)
        missingPlatforms.sorted().forEachIndexed { index, api ->
            val base = 0.84f + (index.toFloat() / max(1, missingPlatforms.size)) * 0.13f
            installPlatform(api, env.sdk, base, onProgress)
        }
""",
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/gradle/MobileGradleToolchain.kt',
              '        destination.parentFile?.mkdirs()\n        val partial = File(destination.absolutePath + ".part")\n',
              """        destination.parentFile?.mkdirs()
        if (destination.isFile && destination.length() in 1..maxBytes && expectedDigest != null) {
            if (digest(destination, algorithm).equals(expectedDigest, ignoreCase = true)) {
                onBytes(destination.length())
                return
            }
            destination.delete()
        }
        val partial = File(destination.absolutePath + ".part")
""",
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/gradle/MobileGradleToolchain.kt',
              """    private fun writeMarker() {
        val temporary = File(files, "$MARKER.tmp")
        temporary.writeText(TOOLCHAIN_VERSION)
        marker.delete()
        check(temporary.renameTo(marker)) { "Cannot write toolchain marker." }
    }
""",
              """    private fun writeMarker() {
        val temporary = File(files, "$MARKER.tmp")
        val backup = File(files, "$MARKER.backup")
        temporary.writeText(TOOLCHAIN_VERSION)
        backup.delete()
        if (marker.exists()) check(marker.renameTo(backup)) { "Cannot preserve the previous toolchain marker." }
        if (!temporary.renameTo(marker)) {
            if (backup.exists()) backup.renameTo(marker)
            error("Cannot write toolchain marker.")
        }
        backup.delete()
    }
""",
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/gradle/MobileGradleToolchain.kt',
              '        private const val MIN_FREE_BYTES = 1_200L * 1024 * 1024\n',
              '        private const val MIN_FREE_BYTES = 1_200L * 1024 * 1024\n        private const val MIN_PLATFORM_FREE_BYTES = 512L * 1024 * 1024\n',
          )

          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/runtime/OperationJournal.kt',
              '        logFile(operationId).appendText(rendered)\n',
              """        val current = logFile(operationId)
        if (current.length() >= MAX_LOG_BYTES) {
            val previous = File(logs, safeId(operationId) + ".previous.log")
            previous.delete()
            check(current.renameTo(previous)) { "Cannot rotate the operation log." }
        }
        current.appendText(rendered)
""",
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/runtime/OperationJournal.kt',
              """        val temporary = File(root, "history.json.tmp")
        temporary.writeText(array.toString(2))
        historyFile.delete()
        check(temporary.renameTo(historyFile)) { "Cannot persist operation history." }
""",
              """        val temporary = File(root, "history.json.tmp")
        val backup = File(root, "history.json.backup")
        temporary.writeText(array.toString(2))
        backup.delete()
        if (historyFile.exists()) check(historyFile.renameTo(backup)) { "Cannot preserve operation history." }
        if (!temporary.renameTo(historyFile)) {
            if (backup.exists()) backup.renameTo(historyFile)
            error("Cannot persist operation history.")
        }
        backup.delete()
""",
          )
          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/runtime/OperationJournal.kt',
              "    private fun singleLine(value: String): String = value.replace('\\r', ' ').replace('\\n', ' ')\n}\n",
              """    private fun singleLine(value: String): String = value.replace('\\r', ' ').replace('\\n', ' ')

    companion object {
        private const val MAX_LOG_BYTES = 5L * 1024 * 1024
    }
}
""",
          )
          PY

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "PocketHost Audit"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "Repair runtime transparency and host safety gaps"
          git push origin HEAD:feature/landscape-observability-v1
