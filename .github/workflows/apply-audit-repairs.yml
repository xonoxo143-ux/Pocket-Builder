          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/host/RuntimeActivity.kt',
              '''    private fun permissionForName(name: String): String? = when (name) {
''',
              '''    private fun isPermissionGrantedOrImplicit(name: String): Boolean {
