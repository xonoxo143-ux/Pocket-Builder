          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/ui/PocketBuildApp.kt',
              '''    onToolchainAction: (String) -> Unit,
    onCancelOperation: () -> Unit,
    onClearOperation: () -> Unit,
) {
