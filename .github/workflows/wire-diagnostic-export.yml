          )

          text_path = Path('app/src/main/java/com/libreseed/pocketbuild/ui/PocketBuildApp.kt')
          text = text_path.read_text()
          old = '''                            onCancelOperation = onCancelOperation,
                            onClearOperation = onClearOperation,
'''
          new = '''                            onCancelOperation = onCancelOperation,
                            onClearOperation = onClearOperation,
                            onExportOperation = onExportOperation,
'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'PocketBuildApp.kt: expected two AppContent callback blocks, found {count}')
          text = text.replace(old, new)
          text_path.write_text(text)

          replace_once(
              'app/src/main/java/com/libreseed/pocketbuild/ui/PocketBuildApp.kt',
              '''                        onCancel = onCancelOperation,
                        onClear = onClearOperation,
                        showTimeline = true,
